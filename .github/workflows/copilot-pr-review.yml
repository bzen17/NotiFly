name: Copilot PR Review

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  copilot-review:
    runs-on: ubuntu-latest

    steps:
      - name: Request Copilot code review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_PAT }}
          script: |
            const prNumber = context.payload.pull_request.number;
            // Adds Copilot as a reviewer — triggers its native inline code review
            // with per-line comments and severity labels (critical/suggestion/nit).
            // Does NOT create commits or new PRs.
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              reviewers: ['copilot'],
            });
