name: CI - Backend

on:
  pull_request:
    paths:
      - 'services/**'
      - 'libs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.eslintrc*'
      - '.prettierrc*'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Install workspace dependencies
        run: |
          npm ci --prefix libs/delivery-adapters
          npm ci --prefix services/producer-service
          npm ci --prefix services/router-service
          npm ci --prefix services/worker-email

      - name: Lint
        run: |
          npm run lint --prefix libs/delivery-adapters
          npm run lint --prefix services/producer-service
          npm run lint --prefix services/router-service
          npm run lint --prefix services/worker-email

      - name: Build libs
        run: npm run build:libs

      - name: Type check
        run: |
          npx tsc --noEmit --project libs/delivery-adapters/tsconfig.json
          npx tsc --noEmit --project services/producer-service/tsconfig.json
          npx tsc --noEmit --project services/router-service/tsconfig.json
          npx tsc --noEmit --project services/worker-email/tsconfig.json

      - name: Test
        run: |
          for dir in libs/delivery-adapters services/producer-service services/router-service services/worker-email; do
            npm test --prefix $dir -- --coverage --coverageReporters=text-summary --coverageReporters=json-summary --passWithNoTests
          done

      - name: Render build verification
        if: github.base_ref == 'main'
        run: |
          npm run build:all
          chmod +x scripts/package-single.sh
          ./scripts/package-single.sh
          for path in \
            "services/producer-service/dist/index.js" \
            "services/producer-service/router-service/dist/index.js" \
            "services/producer-service/worker-email/dist/index.js"; do
            if [ ! -f "$path" ]; then
              echo "❌ Missing: $path"
              exit 1
            fi
            echo "✅ Found: $path"
          done
